services:
  backend:
    build: ./backend
    environment:
      - ALLOW_LIVE=1          # set to 0 to skip live Elexon calls (cache/synthetic only)
    volumes:
      - ./backend/data:/app/data   # persists the fetched Elexon CSV cache
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
